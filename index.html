<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Personal Progress Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f3864'/%3E%3Cpath d='M18 34l10 10 20-22' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mut:#6b7585;--line:#e1e6ee;--acc:#1f3864;--g:#2e9e5b;--a:#d99a1c;--r:#d44a4a;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111723;--card:#1b2434;--tx:#e8edf5;--mut:#98a3b5;--line:#2b364a;--acc:#7fa6e6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111723;--card:#1b2434;--tx:#e8edf5;--mut:#98a3b5;--line:#2b364a;--acc:#7fa6e6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Arial,Helvetica,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:20px;margin:6px 0 2px}.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:600 13px Arial;padding:10px 0;border-radius:9px}
.tabs button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:22px}
.nav div{text-align:center;flex:1}.nav small{display:block;color:var(--mut);font-size:12px}
.note{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--mut);margin-bottom:12px}
.btn,.chip{border:1px solid var(--line);background:var(--card);color:var(--tx);padding:10px 14px;border-radius:20px;font:600 14px Arial;margin:3px 4px 3px 0;display:inline-block;cursor:pointer}
.btn{background:var(--acc);color:var(--bg);border-color:var(--acc);border-radius:10px}.btn.alt{background:var(--card);color:var(--tx);border-color:var(--line)}
.chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.lab{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input[type=date],input[type=number]{border:1px solid var(--line);background:var(--card);color:var(--tx);padding:10px;border-radius:10px;font:16px Arial;max-width:100%}
.ah{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:14px 2px 6px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:13px 14px;margin-bottom:7px;font:15px Arial;border-left:5px solid var(--c)}
.row .ck{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex:none}
.row.on{background:color-mix(in srgb,var(--c) 14%,var(--card))}.row.on .ck{background:var(--c);border-color:var(--c)}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);padding:10px;font:15px Arial;resize:vertical;margin:8px 0}
.kr{margin-bottom:12px}.kr .t,.fl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;gap:8px}.kr .t span,.fl span{color:var(--mut)}
.bar{height:9px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c,var(--acc));border-radius:5px}
.big{font-size:34px;font-weight:700;line-height:1}.g{color:var(--g)}.a{color:var(--a)}.r{color:var(--r)}
.strip,.lbl{display:grid;gap:2px}.strip{align-items:end;height:90px;margin-top:8px}
.strip div{background:var(--line);border-radius:2px 2px 0 0;min-height:3px}
.lbl{font-size:8px;color:var(--mut);text-align:center}
.bd{display:inline-block;font:700 11px Arial;padding:3px 8px;border-radius:10px;background:var(--line);color:var(--tx);margin-left:8px}.bd.ok{background:var(--g);color:#fff}
input[type=text],input[type=password]{width:100%;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:10px;border-radius:10px;font:16px Arial}
#st{text-align:center;color:var(--mut);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>Personal Progress Tracker</h1>
<p class="sub" id="rng"></p>
<div class="tabs" id="tabs"><button data-t="today" class="on">Day</button><button data-t="week">Week</button><button data-t="all">Overall</button><button data-t="hist">History</button><button data-t="set">Settings</button></div>
<div id="app"></div>
<div id="st">Saved on this device</div>
</div>
<script>
const DEF={start:"2026-11-23",weeks:35};
const A={spirit:["Spiritual growth","#8a63c7"],speak:["Speaking skills","#3d8bd9"],school:["Scholarship opportunity","#d9772b"],brain:["Sharp and smart brain","#5d9b3a"],fit:["Physical fitness","#d44a4a"],fun:["Fun","#c99a1a"]};
const K=[["m","Morning prayer","spirit",7],["e","Evening prayer","spirit",7],["s","Practise and record your script","speak",7],["a","Graduate school application step","school",3],["x","Application submitted","school",0],["b","Read a page of your study book","brain",7],["o","Read a biochemistry topic","brain",7],["w","Workout","fit",4],["f","Fun: pool, a new place or a treat","fun",1]];
const CORE=["m","e","s","b","o"],$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0");
const dn=s=>{const[y,m,d]=s.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const ds=n=>new Date(n*864e5).toISOString().slice(0,10);
const fmt=(n,o)=>new Date(n*864e5).toLocaleDateString("en-GB",Object.assign({timeZone:"UTC"},o));
const FL={weekday:"short",day:"numeric",month:"short",year:"numeric"};
const nw=new Date(),TODAY=dn(nw.getFullYear()+"-"+pad(nw.getMonth()+1)+"-"+pad(nw.getDate()));
const clamp=(v,a,b)=>Math.min(Math.max(v,a),b),cls=p=>p>=.8?"g":p>=.5?"a":"r";
let S={days:{},cfg:Object.assign({},DEF),hist:[],ts:0},S0,END,WEEKS,DAYS,sel,wsel,tab="today",ref=null,tm,GH=null,sha=null;
function applyCfg(){WEEKS=clamp(parseInt(S.cfg.weeks)||DEF.weeks,1,104);S.cfg.weeks=WEEKS;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(S.cfg.start))S.cfg.start=DEF.start;
 S0=dn(S.cfg.start);DAYS=WEEKS*7;END=S0+DAYS-1;sel=clamp(TODAY,S0,END);wsel=clamp(wkOf(TODAY),1,WEEKS)}
const wkOf=n=>Math.floor((n-S0)/7)+1;

function tally(w){const c={};K.forEach(k=>c[k[0]]=0);
 for(const d in S.days){const n=dn(d);if(n<S0||n>END||(w&&wkOf(n)!==w))continue;for(const k in c)if(S.days[d][k])c[k]++}return c}
function areaScores(c){const out={};
 for(const a in A){let num=0,den=0;K.forEach(k=>{if(k[2]===a&&k[0]!=="x"){num+=c[k[0]];den+=k[3]}});out[a]=den?Math.min(1,num/den):0}
 return out}
const avg=o=>{const v=Object.values(o);return v.reduce((a,b)=>a+b,0)/v.length},pc=p=>Math.round(p*100)+"%";
const bar=(p,c)=>'<div class="bar"><i style="width:'+Math.round(p*100)+'%;--c:'+c+'"></i></div>';

const mk=j=>({days:j.days,cfg:Object.assign({},DEF,j.cfg||{}),hist:j.hist||[],ts:j.ts||0});
const doc=()=>({app:"progress-tracker",v:2,days:S.days,cfg:S.cfg,hist:S.hist,ts:S.ts});
const say=t=>{$("#st").textContent=t};
try{GH=JSON.parse(localStorage.getItem("ppt_gh")||"null")}catch(e){}
const b64=s=>btoa(unescape(encodeURIComponent(s))),ub64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
async function gh(method,body){const r=await fetch("https://api.github.com/repos/"+GH.repo+"/contents/data.json",{method:method,headers:{Authorization:"Bearer "+GH.token,Accept:"application/vnd.github+json"},body:body?JSON.stringify(body):undefined});
 if(r.status===404&&method==="GET")return null;if(!r.ok)throw new Error("GitHub said "+r.status);return r.json()}
async function pull(){const j=await gh("GET");if(!j)return false;sha=j.sha;const R=JSON.parse(ub64(j.content));
 if((R.ts||0)>S.ts&&R.days){S=mk(R);try{localStorage.setItem("ppt",JSON.stringify(S))}catch(e){}applyCfg();render()}return true}
async function push(){const j=await gh("PUT",{message:"Update tracker "+new Date().toISOString().slice(0,16),content:b64(JSON.stringify(doc())),sha:sha||undefined});
 sha=j.content.sha;say("Saved to GitHub at "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}))}
function save(){S.ts=Date.now();try{localStorage.setItem("ppt",JSON.stringify(S))}catch(e){}
 clearTimeout(tm);tm=setTimeout(async()=>{
  if(ref)ref.set(doc()).catch(()=>{});
  if(GH&&GH.repo&&GH.token){try{await push()}catch(e){try{await pull();await push()}catch(e2){say("GitHub save failed ("+e2.message+"). Saved on this device.")}}}
 },1500)}
const newStart=()=>{const mon=TODAY-((new Date(TODAY*864e5).getUTCDay()+6)%7);return TODAY>END?Math.max(END+1,mon):mon};
function cyc(c){const o=[S0,END,WEEKS,DAYS];S0=dn(c.start);WEEKS=c.weeks;DAYS=WEEKS*7;END=S0+DAYS-1;
 try{const t=tally(0),el=clamp(TODAY-S0+1,0,DAYS);let ps=[],good=0;
  K.forEach(k=>{if(k[0]==="x")return;const ex=k[3]*el/7;ps.push(ex?Math.min(1,t[k[0]]/ex):0)});
  for(let w=1;w<=WEEKS;w++)if(S0+(w-1)*7<=TODAY&&avg(areaScores(tally(w)))>=.8)good++;
  return{score:ps.reduce((a,b)=>a+b,0)/ps.length,good:good,weeks:WEEKS,start:S0,end:END,sub:t.x}}finally{S0=o[0];END=o[1];WEEKS=o[2];DAYS=o[3]}}
function viewHist(){
 const L=S.hist.map(cyc).concat([cyc(S.cfg)]),D={day:"numeric",month:"short",year:"numeric"};
 let h='<div class="card"><div class="big">'+(S.hist.length+(TODAY>END?1:0))+'</div><div class="sub" style="margin:4px 0 0">cycles completed</div></div>';
 L.forEach((c,i)=>{const cur=i===L.length-1,fin=!cur||TODAY>c.end,p=c.score;
  h+='<div class="card"><b>Cycle '+(i+1)+'</b><span class="bd'+(fin&&p>=.8?" ok":"")+'">'+(fin?(p>=.8?"Completed · consistent ✓":"Completed"):"In progress")+'</span>'
  +'<div class="sub" style="margin:4px 0 10px">'+fmt(c.start,D)+' to '+fmt(c.end,D)+' · '+c.weeks+' weeks</div>'
  +'<div class="kr"><div class="t"><b>Overall score</b><span class="'+cls(p)+'">'+pc(p)+'</span></div>'+bar(p,"var(--"+cls(p)+")")+'</div>'
  +'<div class="fl"><b>Consistent weeks (80%+)</b><span>'+c.good+' of '+c.weeks+'</span></div><div class="fl"><b>Applications submitted</b><span>'+c.sub+'</span></div></div>'});
 $("#app").innerHTML=h}

function viewDay(){
 const k=ds(sel),v=S.days[k]||{},core=CORE.filter(x=>v[x]).length;let h='';
 if(TODAY<S0)h+='<div class="note">Tracking starts on '+fmt(S0,FL)+', in '+(S0-TODAY)+' days. You can change this in Settings.</div>';
 else if(TODAY>END)h+='<div class="note">Your time frame ended on '+fmt(END,FL)+'. Extend it in Settings to keep going.</div>';
 else if(sel!==TODAY)h+='<div class="note">You are viewing a different day.<br><button class="btn" data-go="1" style="margin-top:6px">Jump to today</button></div>';
 h+='<div class="nav"><button data-n="-1" aria-label="Previous day">‹</button><div><b>'+fmt(sel,FL)+'</b><small>Week '+wkOf(sel)+' of '+WEEKS+' · '+core+' of 5 daily habits</small></div><button data-n="1" aria-label="Next day">›</button></div>';
 let last="";
 K.forEach(x=>{if(x[2]!==last){h+='<div class="ah" style="color:'+A[x[2]][1]+'">'+A[x[2]][0]+'</div>';last=x[2]}
  h+='<button class="row'+(v[x[0]]?" on":"")+'" data-k="'+x[0]+'" style="--c:'+A[x[2]][1]+'"><span>'+x[1]+'</span><span class="ck">'+(v[x[0]]?"✓":"")+'</span></button>'});
 h+='<div class="ah" style="color:var(--mut)">Notes</div><textarea id="nt" placeholder="e.g. what the fun activity was"></textarea>';
 $("#app").innerHTML=h;$("#nt").value=v.n||"";
}
function viewWeek(){
 const c=tally(wsel),sc=areaScores(c),ov=avg(sc),st=S0+(wsel-1)*7;
 let h='<div class="nav"><button data-w="-1" aria-label="Previous week">‹</button><div><b>Week '+wsel+' of '+WEEKS+'</b><small>'+fmt(st,{day:"numeric",month:"short"})+' to '+fmt(st+6,{day:"numeric",month:"short",year:"numeric"})+'</small></div><button data-w="1" aria-label="Next week">›</button></div>';
 h+='<div class="card"><div class="big '+cls(ov)+'">'+pc(ov)+'</div><div class="sub" style="margin:4px 0 0">Overall score this week</div></div><div class="card">';
 K.forEach(k=>{if(k[0]==="x")return;h+='<div class="kr"><div class="t"><b>'+k[1]+'</b><span>'+c[k[0]]+' / '+k[3]+'</span></div>'+bar(Math.min(1,c[k[0]]/k[3]),A[k[2]][1])+'</div>'});
 h+='<div class="fl"><b>Applications submitted</b><span>'+c.x+'</span></div></div><div class="card">';
 for(const a in A)h+='<div class="kr"><div class="t"><b>'+A[a][0]+'</b><span class="'+cls(sc[a])+'">'+pc(sc[a])+'</span></div>'+bar(sc[a],A[a][1])+'</div>';
 $("#app").innerHTML=h+'</div>';
}
function viewAll(){
 const el=clamp(TODAY-S0+1,0,DAYS),c=tally(0);let ps=[],h='<div class="card">';
 K.forEach(k=>{if(k[0]==="x")return;const ex=k[3]*el/7,p=ex?Math.min(1,c[k[0]]/ex):0;ps.push(p);
  h+='<div class="kr"><div class="t"><b>'+k[1]+'</b><span class="'+cls(p)+'">'+pc(p)+' · '+c[k[0]]+' done</span></div>'+bar(p,A[k[2]][1])+'</div>'});
 const ov=ps.reduce((a,b)=>a+b,0)/ps.length;
 h='<div class="card"><div class="big '+cls(ov)+'">'+pc(ov)+'</div><div class="sub" style="margin:4px 0 0">Overall progress to date · day '+el+' of '+DAYS+'</div></div>'+h;
 h+='<div class="fl"><b>Graduate applications submitted</b><span>'+c.x+(c.x>=1?" · goal reached":"")+'</span></div></div>';
 h+='<div class="card"><b>Score by week</b><div class="strip" style="grid-template-columns:repeat('+WEEKS+',1fr)">';
 let lb='',step=WEEKS>30?5:WEEKS>12?2:1;
 for(let w=1;w<=WEEKS;w++){const s=S0+(w-1)*7;let hh=3,col="var(--line)";
  if(s<=TODAY){const p=avg(areaScores(tally(w)));hh=Math.max(3,Math.round(p*90));col="var(--"+cls(p)+")"}
  h+='<div style="height:'+hh+'px;background:'+col+'"></div>';lb+='<span>'+(w===1||w%step===0?w:"")+'</span>'}
 $("#app").innerHTML=h+'</div><div class="lbl" style="grid-template-columns:repeat('+WEEKS+',1fr)">'+lb+'</div></div>';
}
function viewSet(){
 const chips=[4,8,12,16,24,35,52].map(n=>'<button class="chip'+(n===WEEKS?" on":"")+'" data-wk="'+n+'">'+n+'</button>').join("");
 $("#app").innerHTML='<div class="card"><b>Measurement time frame</b><p class="sub">Choose when tracking starts and how many weeks it runs. Nothing you ticked is deleted; days outside the range are simply not counted.</p>'
 +'<label class="lab" for="sd">Start date</label><input type="date" id="sd" value="'+S.cfg.start+'"> <button class="chip" data-mon="1">This Monday</button>'
 +'<label class="lab">Length in weeks</label><div>'+chips+'</div><label class="lab" for="wn">Or type your own (1 to 104)</label><input type="number" id="wn" min="1" max="104" value="'+WEEKS+'">'
 +'<p class="sub" style="margin-top:12px">Runs from '+fmt(S0,FL)+' to '+fmt(END,FL)+'.</p></div>'
 +'<div class="card"><b>Start a new cycle</b><p class="sub">Archives your current cycle (it stays in History with its score) and starts a fresh one. Your ticks are kept.</p>'
 +'<label class="lab" for="ncs">New cycle starts</label><input type="date" id="ncs" value="'+ds(newStart())+'"><label class="lab" for="ncw">Weeks</label><input type="number" id="ncw" min="1" max="104" value="35">'
 +'<div><button class="btn" id="nc" style="margin-top:10px">Archive and start new cycle</button></div></div>'
 +'<div class="card"><b>Save to GitHub</b><p class="sub">Saves your progress to a private GitHub repo after every tick. Use a private repo (with a README) and a fine-grained token limited to it with Contents: Read and write.</p>'
 +'<label class="lab" for="gr">Data repo (owner/name)</label><input type="text" id="gr" placeholder="Dhemi-analyst/tracker-data" value="'+(GH?GH.repo:"")+'">'
 +'<label class="lab" for="gt">Token</label><input type="password" id="gt" placeholder="github_pat_..." value="'+(GH?GH.token:"")+'">'
 +'<div><button class="btn" id="gs" style="margin-top:10px">Save and sync now</button></div><p class="sub" id="gm"></p></div>'
 +'<div class="card"><b>Backup and restore</b><p class="sub">Download a backup now and then so you can never lose your progress. Restoring replaces what is on this device.</p>'
 +'<button class="btn" id="bk">Download backup</button><label class="btn alt">Restore from file<input type="file" id="rf" accept=".json,application/json" hidden></label>'
 +'<textarea id="bt" placeholder="Backup text shows here. You can also paste a backup here to restore it."></textarea>'
 +'<button class="btn alt" id="bc">Show backup text</button><button class="btn alt" id="br">Restore from text</button><p class="sub" id="msg" style="margin-top:8px"></p></div>';
}
function render(){
 $("#rng").textContent=WEEKS+" weeks · "+fmt(S0,{day:"numeric",month:"short",year:"numeric"})+" to "+fmt(END,{day:"numeric",month:"short",year:"numeric"});
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
 ({today:viewDay,week:viewWeek,all:viewAll,hist:viewHist,set:viewSet})[tab]();
}
const msg=t=>{const m=$("#msg");if(m)m.textContent=t};
const snap=()=>JSON.stringify(doc());
function restore(txt){try{const j=JSON.parse(txt);if(!j||typeof j.days!=="object"||!j.days)throw 0;
 S=mk(j);applyCfg();save();render();msg("Restored "+Object.keys(j.days).length+" days.")}
 catch(e){msg("That backup could not be read.")}}
function setCfg(o){Object.assign(S.cfg,o);applyCfg();save();render()}

document.addEventListener("click",e=>{
 const t=e.target.closest("[data-t],[data-n],[data-w],[data-k],[data-go],[data-wk],[data-mon],#bk,#bc,#br,#nc,#gs");if(!t)return;
 const D=t.dataset;
 if(D.t){tab=D.t}
 else if(D.n){sel=clamp(sel+Number(D.n),S0,END)}
 else if(D.w){wsel=clamp(wsel+Number(D.w),1,WEEKS)}
 else if(D.go){sel=clamp(TODAY,S0,END)}
 else if(D.wk){return setCfg({weeks:Number(D.wk)})}
 else if(D.mon){return setCfg({start:ds(TODAY-((new Date(TODAY*864e5).getUTCDay()+6)%7))})}
 else if(D.k){const d=ds(sel),v=S.days[d]||(S.days[d]={});v[D.k]=v[D.k]?0:1;save()}
 else if(t.id==="bk"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([snap()],{type:"application/json"}));
  a.download="progress-tracker-backup-"+ds(TODAY)+".json";document.body.appendChild(a);a.click();a.remove();
  $("#bt").value=snap();return msg("Backup created. If no file downloaded, copy the text above and keep it somewhere safe.")}
 else if(t.id==="bc"){$("#bt").value=snap();$("#bt").select();return msg("Copy this text and keep it somewhere safe.")}
 else if(t.id==="br"){return restore($("#bt").value)}
 else if(t.id==="nc"){const ns=$("#ncs").value,nk=clamp(parseInt($("#ncw").value)||35,1,104);if(!/^\d{4}-\d{2}-\d{2}$/.test(ns))return;
  S.hist=S.hist.concat([{start:S.cfg.start,weeks:clamp(wkOf(dn(ns)-1),1,WEEKS)}]);S.cfg={start:ns,weeks:nk};applyCfg();save();tab="hist"}
 else if(t.id==="gs"){GH={repo:$("#gr").value.trim(),token:$("#gt").value.trim()};try{localStorage.setItem("ppt_gh",JSON.stringify(GH))}catch(e){}
  const m=$("#gm");m.textContent="Connecting...";
  (async()=>{try{await pull();await push();m.textContent="Connected. Your progress now saves to GitHub."}catch(e){m.textContent="Could not connect ("+e.message+"). Check the repo name and token."}})();return}
 render();
});
document.addEventListener("input",e=>{if(e.target.id==="nt"){const d=ds(sel),v=S.days[d]||(S.days[d]={});v.n=e.target.value;save()}});
document.addEventListener("change",e=>{
 if(e.target.id==="sd"&&e.target.value)setCfg({start:e.target.value});
 else if(e.target.id==="wn"&&e.target.value)setCfg({weeks:e.target.value});
 else if(e.target.id==="rf"&&e.target.files[0]){const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(e.target.files[0])}
});

try{const j=JSON.parse(localStorage.getItem("ppt")||"null");if(j&&j.days)S=mk(j)}catch(e){}
applyCfg();render();
if(GH&&GH.token)pull().then(ok=>{if(!ok){if(Object.keys(S.days).length)return push()}else say("Synced with GitHub")}).catch(e=>say("GitHub load failed ("+e.message+")"));

try{const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");
 x.fillStyle="#1f3864";x.fillRect(0,0,512,512);x.strokeStyle="#fff";x.lineWidth=46;x.lineCap="round";x.lineJoin="round";
 x.beginPath();x.moveTo(130,276);x.lineTo(220,364);x.lineTo(384,170);x.stroke();
 const u=c.toDataURL("image/png"),l=document.createElement("link");l.rel="apple-touch-icon";l.href=u;document.head.appendChild(l);
 const m=document.createElement("link");m.rel="manifest";
 m.href=URL.createObjectURL(new Blob([JSON.stringify({name:"Personal Progress Tracker",short_name:"Tracker",display:"standalone",start_url:location.href.split("#")[0],background_color:"#1f3864",theme_color:"#1f3864",icons:[{src:u,sizes:"512x512",type:"image/png"}]})],{type:"application/manifest+json"}));
 document.head.appendChild(m)}catch(e){}

(async()=>{try{
 if(!window.claude)return;
 const u=await claude.use("user"),d=await claude.use("db");if(!u||!d)return;
 const id=await u.id();if(!id)return;
 ref=d.collection("data/users/"+id).doc("tracker");
 const s=await ref.get();
 if(s.exists&&s.data()&&s.data().days){S=mk(s.data());applyCfg();try{localStorage.setItem("ppt",JSON.stringify(S))}catch(e){}render()}
 else if(Object.keys(S.days).length)ref.set(doc());
 $("#st").textContent="Saved to your Claude account";
}catch(e){ref=null}})();
</script>
</body>
</html>
